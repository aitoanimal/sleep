<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>睡眠管理 - あい vs かい</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #fff7f0;
      --accent: #ff8a5c;
      --accent-soft: #ffe0cc;
      --text-main: #333;
      --text-sub: #777;
      --border: #ffd0b0;
      --button-bg: #ff8a5c;
      --button-text: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at top, #ffe9d6 0, #fff7f0 40%, #ffffff 100%);
      font-family: "Helvetica Neue", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text-main);
    }

    .app {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border-radius: 32px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(255, 138, 92, 0.18);
      border: 2px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    h1 {
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
    }

    .info {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .cat-wrapper {
      margin: 0 auto 20px;
      width: 220px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      background: #fff5eb;
      border: 1px solid #ffd9bf;
    }

    .cat-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .icon-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 12px;
      margin-bottom: 8px;
    }

    .person-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .person-btn img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: #fff;
    }

    .person-label {
      font-size: 13px;
      color: var(--text-main);
      letter-spacing: 0.08em;
    }

    .sleep-time {
      font-size: 16px;
      font-weight: 400;
      margin-top: 8px;
      color: var(--text-main);
    }

    button.main {
      margin-top: 18px;
      padding: 12px 32px;
      border-radius: 999px;
      border: none;
      background: var(--button-bg);
      color: var(--button-text);
      font-size: 15px;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
      box-shadow: 0 8px 18px rgba(255, 138, 92, 0.35);
    }

    button.main:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(255, 138, 92, 0.45);
    }

    .winner {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      color: var(--accent);
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .history {
      margin-top: 18px;
      text-align: left;
      font-size: 13px;
      color: var(--text-sub);
      max-height: 160px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .history-item {
      padding: 6px 0;
      border-bottom: 1px solid #ffe3cf;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="card">

      <!-- トップ画面：あい or かい を選択 -->
      <div id="topScreen">
        <h1>睡眠管理</h1>
        <div class="info">誰の睡眠を記録する？</div>

        <div class="icon-row">
          <button class="person-btn" id="selectAiBtn">
            <img src="ai_icon.png" alt="あいアイコン" />
            <span class="person-label">あい</span>
          </button>
          <button class="person-btn" id="selectKaiBtn">
            <img src="kai_icon.png" alt="かいアイコン" />
            <span class="person-label">かい</span>
          </button>
        </div>

        <div class="cat-wrapper">
          <img src="cat_sleep.png" alt="寝ている猫" />
        </div>

        <div class="info">選んだ人の睡眠を、白黒ハチワレ猫が見守ります。</div>

        <button class="main" id="viewHistoryBtn">睡眠履歴を見る</button>
        <div id="history" class="history"></div>
      </div>

      <!-- 睡眠中画面 -->
      <div id="sleepScreen" style="display:none;">
        <h1 id="sleepTitle"></h1>

        <div class="cat-wrapper">
          <img id="sleepCat" src="cat_sleep.png" alt="寝ている猫" />
        </div>

        <div id="sleepStatus" class="info"></div>

        <button class="main" id="wakeBtn">起きる</button>
      </div>

      <!-- 結果画面 -->
      <div id="resultScreen" style="display:none;">
        <h1>結果</h1>

        <div class="cat-wrapper">
          <img id="resultCat" src="cat_good.png" alt="猫" />
        </div>

        <div id="resultText" class="sleep-time"></div>

        <div id="winner" class="winner"></div>

        <button class="main" id="backBtn">トップに戻る</button>
      </div>

    </div>
  </div>

  <script>
    const topScreen = document.getElementById("topScreen");
    const sleepScreen = document.getElementById("sleepScreen");
    const resultScreen = document.getElementById("resultScreen");

    const selectAiBtn = document.getElementById("selectAiBtn");
    const selectKaiBtn = document.getElementById("selectKaiBtn");

    const sleepTitle = document.getElementById("sleepTitle");
    const sleepStatus = document.getElementById("sleepStatus");
    const sleepCat = document.getElementById("sleepCat");

    const wakeBtn = document.getElementById("wakeBtn");
    const backBtn = document.getElementById("backBtn");

    const resultText = document.getElementById("resultText");
    const winnerEl = document.getElementById("winner");
    const resultCat = document.getElementById("resultCat");

    const viewHistoryBtn = document.getElementById("viewHistoryBtn");
    const historyEl = document.getElementById("history");

    let selectedPerson = null;
    let sleepStart = null;

    function formatTime(date) {
      const h = String(date.getHours()).padStart(2, "0");
      const m = String(date.getMinutes()).padStart(2, "0");
      return `${h}:${m}`;
    }

    function loadHistory() {
      historyEl.innerHTML = "";
      const data = JSON.parse(localStorage.getItem("sleepHistory") || "[]");
      if (data.length === 0) {
        historyEl.textContent = "まだ履歴はありません。";
        return;
      }
      data.slice().reverse().forEach(item => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.textContent =
          `${item.date} / あい: ${item.ai.toFixed(1)}h, かい: ${item.kai.toFixed(1)}h, WINNER: ${item.winner}`;
        historyEl.appendChild(div);
      });
    }

    viewHistoryBtn.addEventListener("click", loadHistory);

    selectAiBtn.addEventListener("click", () => {
      selectedPerson = "あい";
      startSleep();
    });

    selectKaiBtn.addEventListener("click", () => {
      selectedPerson = "かい";
      startSleep();
    });

    function startSleep() {
      sleepStart = new Date();
      sleepTitle.textContent = `${selectedPerson} の睡眠中…`;
      sleepStatus.textContent = `就寝時刻：${formatTime(sleepStart)}　おやすみなさい。`;
      sleepCat.src = "cat_sleep.png";

      topScreen.style.display = "none";
      sleepScreen.style.display = "block";
    }

    wakeBtn.addEventListener("click", () => {
      const wakeTime = new Date();
      const diffHours =
        (wakeTime.getTime() - sleepStart.getTime()) / 1000 / 60 / 60;

      const aiSleep = selectedPerson === "あい" ? diffHours : diffHours + Math.random() * 0.3;
      const kaiSleep = selectedPerson === "かい" ? diffHours : diffHours + Math.random() * 0.3;

      resultText.textContent =
        `あい：${aiSleep.toFixed(1)} 時間　／　かい：${kaiSleep.toFixed(1)} 時間`;

      let winner;
      if (aiSleep > kaiSleep) {
        winner = "あい";
        winnerEl.textContent = "WINNER：あい 🏆";
      } else if (kaiSleep > aiSleep) {
        winner = "かい";
        winnerEl.textContent = "WINNER：かい 🏆";
      } else {
        winner = "DRAW";
        winnerEl.textContent = "DRAW 🤝";
      }

      if (diffHours >= 7) {
        resultCat.src = "cat_good.png";
      } else {
        resultCat.src = "cat_bad.png";
      }

      const history = JSON.parse(localStorage.getItem("sleepHistory") || "[]");
      history.push({
        date: new Date().toLocaleString("ja-JP"),
        ai: aiSleep,
        kai: kaiSleep,
        winner
      });
      localStorage.setItem("sleepHistory", JSON.stringify(history));

      sleepScreen.style.display = "none";
      resultScreen.style.display = "block";
    });

    backBtn.addEventListener("click", () => {
      resultScreen.style.display = "none";
      topScreen.style.display = "block";
      loadHistory();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>睡眠管理アプリ - あい vs かい</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* spicato 10th風：ポップで明るいデザイン */
    :root {
      --bg: #fff7f0;
      --accent: #ff8a5c;
      --accent-soft: #ffe0cc;
      --text-main: #333;
      --text-sub: #777;
      --border: #ffd0b0;
      --button-bg: #ff8a5c;
      --button-text: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at top, #ffe9d6 0, #fff7f0 40%, #ffffff 100%);
      font-family: "Helvetica Neue", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text-main);
    }

    .app {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 32px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(255, 138, 92, 0.18);
      border: 2px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    h1 {
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
    }

    .cat-wrapper {
      margin: 0 auto 20px;
      width: 220px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      background: #fff5eb;
      border: 1px solid #ffd9bf;
    }

    .cat-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .info {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .sleep-time {
      font-size: 16px;
      font-weight: 400;
      margin-top: 8px;
      color: var(--text-main);
    }

    button {
      margin-top: 18px;
      padding: 12px 32px;
      border-radius: 999px;
      border: none;
      background: var(--button-bg);
      color: var(--button-text);
      font-size: 15px;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
      box-shadow: 0 8px 18px rgba(255, 138, 92, 0.35);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(255, 138, 92, 0.45);
    }

    .winner {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: var(--accent);
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="card">
      <h1>睡眠管理 - あい vs かい</h1>

      <div class="cat-wrapper">
        <img id="catImage" src="cat_sleep.png" alt="寝ている猫のイラスト" />
      </div>

      <div id="status" class="info">
        「寝る」ボタンを押して就寝を記録してください。
      </div>

      <div id="sleepTime" class="sleep-time"></div>

      <button id="sleepBtn">寝る</button>
      <button id="wakeBtn" style="display:none;">起きた</button>

      <div id="winner" class="winner"></div>
    </div>
  </div>

  <script>
    const sleepBtn = document.getElementById("sleepBtn");
    const wakeBtn = document.getElementById("wakeBtn");
    const catImage = document.getElementById("catImage");
    const status = document.getElementById("status");
    const sleepTimeEl = document.getElementById("sleepTime");
    const winnerEl = document.getElementById("winner");

    let sleepStart = null;
    let aiSleep = null;
    let kaiSleep = null;

    function formatTime(date) {
      const h = String(date.getHours()).padStart(2, "0");
      const m = String(date.getMinutes()).padStart(2, "0");
      return `${h}:${m}`;
    }

    sleepBtn.addEventListener("click", () => {
      sleepStart = new Date();
      status.textContent = `就寝時刻：${formatTime(sleepStart)}　おやすみなさい。`;
      catImage.src = "cat_sleep.png";
      sleepBtn.style.display = "none";
      wakeBtn.style.display = "inline-block";
      winnerEl.textContent = "";
    });

    wakeBtn.addEventListener("click", () => {
      if (!sleepStart) return;

      const wakeTime = new Date();
      const diffHours =
        (wakeTime.getTime() - sleepStart.getTime()) / 1000 / 60 / 60;

      // ランダムに「あい」か「かい」の睡眠時間を記録
      aiSleep = diffHours + Math.random() * 0.5;
      kaiSleep = diffHours + Math.random() * 0.5;

      sleepTimeEl.textContent = `あい：${aiSleep.toFixed(1)} 時間　／　かい：${kaiSleep.toFixed(1)} 時間`;

      wakeBtn.style.display = "none";
      sleepBtn.style.display = "inline-block";

      if (diffHours >= 7) {
        catImage.src = "cat_good.png";
        status.textContent = `起床時刻：${formatTime(wakeTime)}　よく眠れました。`;
      } else {
        catImage.src = "cat_bad.png";
        status.textContent = `起床時刻：${formatTime(wakeTime)}　睡眠が少なめです。`;
      }

      // 勝者判定
      if (aiSleep > kaiSleep) {
        winnerEl.textContent = "WINNER：あい 🏆";
      } else if (kaiSleep > aiSleep) {
        winnerEl.textContent = "WINNER：かい 🏆";
      } else {
        winnerEl.textContent = "DRAW 🤝";
      }

      sleepStart = null;
    });
  </script>
</body>
</html>

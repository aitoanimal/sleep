<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>睡眠管理 - あい vs かい</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* spicato 10th風：ポップで明るいデザイン */
    :root {
      --bg: #fff7f0;
      --accent: #ff8a5c;
      --accent-soft: #ffe0cc;
      --text-main: #333;
      --text-sub: #777;
      --border: #ffd0b0;
      --button-bg: #ff8a5c;
      --button-text: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at top, #ffe9d6 0, #fff7f0 40%, #ffffff 100%);
      font-family: "Helvetica Neue", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text-main);
    }

    .app {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 32px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(255, 138, 92, 0.18);
      border: 2px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    h1 {
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
    }

    .cat-wrapper {
      margin: 0 auto 20px;
      width: 220px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      background: #fff5eb;
      border: 1px solid #ffd9bf;
    }

    .cat-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .info {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .sleep-time {
      font-size: 16px;
      font-weight: 400;
      margin-top: 8px;
      color: var(--text-main);
    }

    button {
      margin-top: 18px;
      padding: 12px 32px;
      border-radius: 999px;
      border: none;
      background: var(--button-bg);
      color: var(--button-text);
      font-size: 15px;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
      box-shadow: 0 8px 18px rgba(255, 138, 92, 0.35);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(255, 138, 92, 0.45);
    }

    .winner {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      color: var(--accent);
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="card">

      <!-- トップ画面 -->
      <div id="topScreen">
        <h1>睡眠管理</h1>

        <div class="cat-wrapper">
          <img src="cat_sleep.png" alt="寝ている猫" />
        </div>

        <div class="info">寝る準備ができたら「寝る」を押してね。</div>

        <button id="goSleepBtn">寝る</button>
      </div>

      <!-- 睡眠中画面 -->
      <div id="sleepScreen" style="display:none;">
        <h1>睡眠中…</h1>

        <div class="cat-wrapper">
          <img src="cat_sleep.png" alt="寝ている猫" />
        </div>

        <div id="sleepStatus" class="info"></div>

        <button id="wakeBtn">起きる</button>
      </div>

      <!-- 結果画面 -->
      <div id="resultScreen" style="display:none;">
        <h1>結果</h1>

        <div class="cat-wrapper">
          <img id="resultCat" src="cat_good.png" alt="猫" />
        </div>

        <div id="resultText" class="sleep-time"></div>

        <div id="winner" class="winner"></div>

        <button id="backBtn">トップに戻る</button>
      </div>

    </div>
  </div>

  <script>
    const topScreen = document.getElementById("topScreen");
    const sleepScreen = document.getElementById("sleepScreen");
    const resultScreen = document.getElementById("resultScreen");

    const goSleepBtn = document.getElementById("goSleepBtn");
    const wakeBtn = document.getElementById("wakeBtn");
    const backBtn = document.getElementById("backBtn");

    const sleepStatus = document.getElementById("sleepStatus");
    const resultText = document.getElementById("resultText");
    const winnerEl = document.getElementById("winner");
    const resultCat = document.getElementById("resultCat");

    let sleepStart = null;

    function formatTime(date) {
      const h = String(date.getHours()).padStart(2, "0");
      const m = String(date.getMinutes()).padStart(2, "0");
      return `${h}:${m}`;
    }

    // トップ → 睡眠中
    goSleepBtn.addEventListener("click", () => {
      sleepStart = new Date();
      sleepStatus.textContent = `就寝時刻：${formatTime(sleepStart)}　おやすみなさい。`;

      topScreen.style.display = "none";
      sleepScreen.style.display = "block";
    });

    // 睡眠中 → 結果
    wakeBtn.addEventListener("click", () => {
      const wakeTime = new Date();
      const diffHours =
        (wakeTime.getTime() - sleepStart.getTime()) / 1000 / 60 / 60;

      // あい・かいの睡眠時間（ランダム補正）
      const aiSleep = diffHours + Math.random() * 0.3;
      const kaiSleep = diffHours + Math.random() * 0.3;

      resultText.textContent =
        `あい：${aiSleep.toFixed(1)} 時間　／　かい：${kaiSleep.toFixed(1)} 時間`;

      // WINNER 判定
      if (aiSleep > kaiSleep) {
        winnerEl.textContent = "WINNER：あい 🏆";
      } else if (kaiSleep > aiSleep) {
        winnerEl.textContent = "WINNER：かい 🏆";
      } else {
        winnerEl.textContent = "DRAW 🤝";
      }

      // 猫の表情
      if (diffHours >= 7) {
        resultCat.src = "cat_good.png";
      } else {
        resultCat.src = "cat_bad.png";
      }

      sleepScreen.style.display = "none";
      resultScreen.style.display = "block";
    });

    // トップに戻る
    backBtn.addEventListener("click", () => {
      resultScreen.style.display = "none";
      topScreen.style.display = "block";
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>睡眠管理アプリ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* spicato 10th 風のポップで明るいデザイン */

    :root {
      --bg: #fff7f0;
      --card-bg: #ffffff;
      --accent: #ff8a5c;
      --accent-soft: #ffe0cc;
      --text-main: #333333;
      --text-sub: #777777;
      --border: #ffd0b0;
      --button-bg: #ff8a5c;
      --button-text: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at top, #ffe9d6 0, #fff7f0 40%, #ffffff 100%);
      font-family: "Helvetica Neue", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text-main);
    }

    .app {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 32px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(255, 138, 92, 0.18);
      border: 2px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: var(--accent-soft);
      top: -40px;
      right: -40px;
      opacity: 0.7;
    }

    h1 {
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 20px;
      letter-spacing: 0.08em;
    }

    .cat-wrapper {
      margin: 0 auto 20px;
      width: 220px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      background: #fff5eb;
      border: 1px solid #ffd9bf;
    }

    .cat-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .info {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .sleep-time {
      font-size: 16px;
      font-weight: 400;
      margin-top: 8px;
      color: var(--text-main);
    }

    button {
      margin-top: 18px;
      padding: 12px 32px;
      border-radius: 999px;
      border: none;
      background: var(--button-bg);
      color: var(--button-text);
      font-size: 15px;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
      box-shadow: 0 8px 18px rgba(255, 138, 92, 0.35);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(255, 138, 92, 0.45);
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 4px 10px rgba(255, 138, 92, 0.3);
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    #wakeBtn {
      background: #ffb15c;
    }

    .subtext {
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-sub);
      letter-spacing: 0.04em;
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 0.08em;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="card">
      <h1>睡眠管理</h1>
      <div class="tagline">CAT SLEEP TRACKER</div>

      <div class="cat-wrapper">
        <!-- ここに猫のイラスト画像を置く（sleep / good / bad） -->
        <img id="catImage" src="cat_sleep.png" alt="寝ている猫のイラスト" />
      </div>

      <div id="status" class="info">
        寝る前に「寝る」ボタンをタップしてください。
      </div>
